<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f5ec">
  <title>家族の買い物リスト</title>
  <link rel="stylesheet" href="./style.css">
  <script src="./app.js" defer></script>
</head>
<body>
  <main>
    <header>
      <h1>家族の買い物リスト</h1>
      <button id="logout" class="secondary" type="button" hidden>ログアウト</button>
    </header>
    <p id="status" role="status" aria-live="polite">読み込み中…</p>
    <button id="login" type="button" hidden>Google でログイン</button>
    <section id="shopping" aria-label="買い物リスト" hidden>
      <form id="add-form">
        <label for="item-name">買うもの</label>
        <div class="controls">
          <input id="item-name" name="item" placeholder="例：牛乳" maxlength="80" required>
          <button id="add" type="submit">追加</button>
        </div>
      </form>
      <div class="list-heading">
        <h2>買うもの</h2>
        <button id="refresh" class="secondary" type="button" hidden>更新</button>
      </div>
      <p id="empty" hidden>買うものはありません。</p>
      <ul id="pending"></ul>
      <section id="purchased" aria-labelledby="purchased-title" hidden>
        <h2 id="purchased-title">買ったもの</h2>
        <ul id="completed"></ul>
      </section>
    </section>
  </main>
</body>
</html>
